        '" title="Auf Automatik zurücksetzen" aria-label="Auf Automatik zurücksetzen">&times;</button></div>';
    }).join("")+'</div><div class="rowbtns"><button type="button" class="btn sm ghost" id="clearAllOv">Alle auf Automatik</button></div></div></section>';
}

/* ---------- Termin manuell setzen ---------------------------------------- */
var popCtx = null;
function openPop(issueId, stepNr, anchorEl){
  var x = model.issues.filter(function(i){ return i.id === issueId; })[0];
  if (!x) return;
  var r = x.byNr.get(stepNr), auto = x.autoByNr.get(stepNr);
  if (!r) return;
  popCtx = {issue:x, nr:stepNr};
  var pop = el("pop");
  pop.innerHTML =
    '<span class="who">'+esc(x.name)+'</span>'+
    '<h3>'+stepNr+' · '+esc(r.step.label)+'</h3>'+
    '<input type="date" id="popDate" value="'+iso(r.date)+'" aria-label="Termin">'+
    '<div class="auto">Automatisch: <b>'+(auto ? wd(auto.date)+" "+fmt(auto.date) : "–")+'</b>'+
      (r.step.wd ? ' · Ziel-Wochentag '+WD_LONG[r.step.wd-1] : ' · flexibler Arbeitstag')+'</div>'+
    '<div class="warnline" id="popWarn"></div>'+
    '<div class="popbtns">'+
      '<button type="button" class="btn sm primary" data-pop="apply">Übernehmen</button>'+
      (r.manual ? '<button type="button" class="btn sm" data-pop="clear">Automatik</button>' : "")+
      '<button type="button" class="btn sm ghost" data-pop="close">Abbrechen</button>'+
    '</div>';
  pop.hidden = false; el("popMask").hidden = false;
  var box = pop.getBoundingClientRect(), rect = anchorEl.getBoundingClientRect();
  var top = Math.min(rect.bottom + 6, window.innerHeight - box.height - 10);
  var left = Math.min(Math.max(8, rect.left), window.innerWidth - box.width - 10);
  pop.style.top = Math.max(8, top) + "px";
  pop.style.left = left + "px";
  var inp = el("popDate");
  inp.focus();
  inp.addEventListener("input", popCheck);
  popCheck();
}
function popCheck(){
  var inp = el("popDate"), w = el("popWarn");
  if (!inp || !w) return;
  if (!inp.value){ w.textContent = ""; return; }
  var d = parseISO(inp.value), msgs = [];
  if (isFreeDay(d, model.hol.set)) msgs.push("Wochenende oder Feiertag");
  var st = popCtx && popCtx.issue.byNr.get(popCtx.nr);
  if (st && st.step.wd && dow(d) !== st.step.wd) msgs.push("nicht "+WD_LONG[st.step.wd-1]);
  w.textContent = msgs.length ? "Hinweis: " + msgs.join(", ") + "." : "";
}
function closePop(){
  popCtx = null;
  el("pop").hidden = true; el("popMask").hidden = true;
}

/* ---------- Kopfzeile mit Kennzahlen ------------------------------------- */
function renderMeta(){
  var is = model.issues;
  if (!is.length){ el("metabar").innerHTML = '<div class="m"><span class="k">Keine Ausgaben</span><span class="v">–</span></div>'; return; }
  var first = new Date(Math.min.apply(null, is.map(function(x){ return +x.first; })));
  var last  = new Date(Math.max.apply(null, is.map(function(x){ return +x.last; })));
  var warn  = model.findings.filter(function(f){ return f.sev !== "info"; }).length;
  var runs  = is.map(function(x){ return diffDays(x.first, x.etag); });
  var avg   = Math.round(runs.reduce(function(a,b){ return a+b; }, 0) / runs.length);
  el("metabar").innerHTML = [
    ["Ausgaben", is.length + " × " + state.steps.length + " Termine"],
    ["Produktionsstart", wd(first) + " " + fmt(first)],
    ["Letzter Termin", wd(last) + " " + fmt(last)],
    ["Vorlauf ø", avg + " Tage"],
    ["Prüfung", warn ? warn + (warn === 1 ? " Hinweis" : " Hinweise") : "ohne Befund", warn ? "warnv" : "okv"]
  ].map(function(m){
    return '<div class="m"><span class="k">'+m[0]+'</span><span class="v '+(m[2]||"")+'">'+m[1]+'</span></div>';
  }).join("");
}

/* ---------- Panel-Router -------------------------------------------------- */
function renderPanel(){
  var v = state.view, html;
  if (model.broken && v !== "regeln") v = "pruefung";
  if      (v === "plaene")   html = viewPlaene();
  else if (v === "aufgaben") html = viewAufgaben();
  else if (v === "plan")     html = viewPlan();
  else if (v === "ausgabe")  html = viewIssue();
  else if (v === "kalender") html = viewCalendar();
  else if (v === "pruefung") html = viewFindings();
  else if (v === "regeln")   html = viewRules();
  else                       html = viewExport();
  el("panel").innerHTML = html;
  if (state.view === "export") buildExport();
  if (state.view === "aufgaben") fuellePersonen();
}

/* ---------- Ansicht: Terminplan ------------------------------------------ */
function cellHTML(r, issue){
  var cls = "cell click" + (r.manual ? " manual" : "") + (!r.manual && Math.abs(r.shift) >= 1 ? " shifted" : "");
  var auto = issue ? issue.autoByNr.get(r.step.nr) : null;
  var title;
  if (r.manual){
    title = "Manuell gesetzt auf " + WD_LONG[dow(r.date)-1] + ", " + fmt(r.date) +
            (auto ? "\nAutomatisch wäre " + fmt(auto.date) : "") + "\nZum Ändern anklicken";
  } else if (r.shift){
    title = "Rechenbasis " + fmt(r.basis) + " → " + fmt(r.date) + " (" + WD_LONG[dow(r.date)-1] + ", " +
            (r.shift > 0 ? "+" : "") + r.shift + " Tage)\nZum manuellen Setzen anklicken";
  } else {
    title = WD_LONG[dow(r.date)-1] + ", KW " + isoWeek(r.date) + "\nZum manuellen Setzen anklicken";
  }
  return '<td class="'+cls+'" data-issue="'+esc(issue ? issue.id : "")+'" data-step="'+r.step.nr+
    '" title="'+esc(title)+'"><span class="wd">'+wd(r.date)+'</span>'+fmtShort(r.date)+'</td>';
}
function viewPlan(){
  var is = model.issues;
  if (!is.length) return card("Terminplan", '<div class="empty">Noch keine Ausgabe angelegt.</div>');
  var head =
    '<div class="printhead"><div class="mag">Berliner Wirtschaft</div>'+
    '<h2>Produktionsplan '+esc(is[0].name)+" bis "+esc(is[is.length-1].name)+' '+state.year+'</h2>'+
    '<div class="sub">Magazin der IHK Berlin · Stand '+fmt(D(new Date().getFullYear(), new Date().getMonth()+1, new Date().getDate()))+'</div></div>';
  var body;
  if (state.orientation === "steps"){
    var rows = "", lastPhase = null;
    model.steps.forEach(function(s){
      var ph = phaseOf(s);
      if (ph.key !== lastPhase){
        rows += '<tr class="phaserow" style="--ph:'+ph.css+'"><th class="rowhead"><span class="phaselabel">'+esc(ph.label)+
                '</span></th><td colspan="'+is.length+'"></td></tr>';
        lastPhase = ph.key;
      }
      rows += '<tr'+(s.anchor === 0 ? ' class="milestone"' : "")+' style="--ph:'+ph.css+'">'+
        '<th class="rowhead"><div class="steprow"><span class="stepnr">'+s.nr+'</span>'+
        '<span class="stepname">'+esc(s.label)+'</span>'+
        '<span class="wdbadge'+(s.wd ? " fix" : "")+'">'+(s.wd ? WD_SHORT[s.wd-1] : "flex")+'</span></div></th>'+
        is.map(function(x){ var r = x.byNr.get(s.nr); return r ? cellHTML(r, x) : '<td class="cell">–</td>'; }).join("")+
      '</tr>';
    });
    body = '<table class="plan"><thead><tr><th class="corner">Produktionsschritt</th>'+
      is.map(function(x){ return '<th>'+esc(x.name)+'<span class="sub">'+wd(x.etag)+" "+fmtShort(x.etag)+'</span></th>'; }).join("")+
      '</tr></thead><tbody>'+rows+'</tbody></table>';
  } else {
    body = '<table class="plan wide"><thead><tr><th class="corner">Ausgabe</th>'+
      model.steps.map(function(s){
        return '<th class="stepcol" style="--ph:'+phaseOf(s).css+'"><span class="stepnr">'+s.nr+'</span> '+esc(s.label)+
               '<span class="sub">'+(s.wd ? WD_SHORT[s.wd-1] : "flex")+'</span></th>';
      }).join("")+'</tr></thead><tbody>'+
      is.map(function(x){
        return '<tr style="--ph:var(--ph-2)"><th class="rowhead"><div class="steprow"><span class="stepname">'+esc(x.name)+
          '</span></div></th>'+
          model.steps.map(function(s){ var r = x.byNr.get(s.nr); return r ? cellHTML(r, x) : '<td class="cell">–</td>'; }).join("")+
        '</tr>';
      }).join("")+'</tbody></table>';
  }
  var tools =
    '<button type="button" class="btn sm" data-act="orient" data-v="steps" aria-pressed="'+(state.orientation === "steps")+'">Schritte als Zeilen</button>'+
    '<button type="button" class="btn sm" data-act="orient" data-v="issues" aria-pressed="'+(state.orientation === "issues")+'">Ausgaben als Zeilen</button>';
  return card("Terminplan " + state.year, head + '<div class="tablewrap">'+body+'</div>', tools);
}

/* ---------- Ansicht: einzelne Ausgabe ------------------------------------ */
function viewIssue(){
  var is = model.issues;
  if (!is.length) return card("Ausgabe", '<div class="empty">Noch keine Ausgabe angelegt.</div>');
  var idx = Math.min(state.selected, is.length - 1), x = is[idx];
  var rows = x.rows.slice().sort(function(a,b){ return a.date - b.date || a.step.nr - b.step.nr; });
  var lastPhase = null, out = "";
  rows.forEach(function(r){
    var ph = phaseOf(r.step);
    if (ph.key !== lastPhase){
      out += '<div class="phasebar" style="--ph:'+ph.css+'">'+esc(ph.label)+'<span class="ln"></span></div>';
      lastPhase = ph.key;
    }
    var rel = diffDays(r.date, x.etag);
    var auto = x.autoByNr.get(r.step.nr);
    var extra = r.manual
      ? '<span class="manualnote">Manuell gesetzt'+(auto && +auto.date !== +r.date ? ' · automatisch '+fmt(auto.date) : "")+'</span>'
      : (r.shift ? '<span class="shift">Basis '+fmt(r.basis)+' → verschoben auf '+WD_LONG[dow(r.date)-1]+' ('+(r.shift>0?"+":"")+r.shift+' Tage)</span>' : "");
    out += '<div class="tl click'+(r.step.anchor === 0 ? " ms" : "")+(r.manual ? " manual" : "")+
      '" style="--ph:'+ph.css+'" data-issue="'+esc(x.id)+'" data-step="'+r.step.nr+'" title="Zum Setzen eines eigenen Termins anklicken">'+
      '<span class="d"><span class="wd">'+wd(r.date)+'</span>'+fmt(r.date)+'</span>'+
      '<span class="kw">KW&nbsp;'+isoWeek(r.date)+'</span>'+
      '<span class="nm"><span class="nr">'+r.step.nr+'</span>'+esc(r.step.label)+extra+'</span>'+
      '<span class="rel">'+(rel > 0 ? "E − " + rel + " T" : "E-Tag")+'</span>'+
    '</div>';
  });
  var sel = '<select id="issueSel" aria-label="Ausgabe wählen">'+is.map(function(y, i){
      return '<option value="'+i+'"'+(i === idx ? " selected" : "")+'>'+esc(y.name)+'</option>';
    }).join("")+'</select>';
  var headBar = '<div class="detailhead">'+sel+
    '<span class="etag">E-Tag '+wd(x.etag)+" "+fmt(x.etag)+'</span>'+
    '<span class="kw" style="font-family:var(--mono);font-size:12px;color:var(--ink-3)">Vorlauf '+diffDays(x.first, x.etag)+' Tage · Start '+fmt(x.first)+'</span>'+
    '<span class="spacer"></span></div>';
  return card("Ausgabe im Detail", headBar + '<div class="timeline">'+out+'</div>');
}

/* ---------- Ansicht: Jahreskalender -------------------------------------- */
function viewCalendar(){
  var is = model.issues;
  if (!is.length) return card("Kalender", '<div class="empty">Noch keine Ausgabe angelegt.</div>');
  var byDay = new Map();
  is.forEach(function(x){
    x.rows.forEach(function(r){
      var k = iso(r.date);
      if (!byDay.has(k)) byDay.set(k, []);
      byDay.get(k).push({issue:x, r:r});
    });
  });
  var min = new Date(Math.min.apply(null, is.map(function(x){ return +x.first; })));
  var max = new Date(Math.max.apply(null, is.map(function(x){ return +x.last; })));
  var months = [], cur = D(min.getUTCFullYear(), min.getUTCMonth()+1, 1);
  while (cur <= max){
    months.push(cur);
    cur = D(cur.getUTCFullYear(), cur.getUTCMonth()+2, 1);
  }
  var grid = months.map(function(m){
    var y = m.getUTCFullYear(), mo = m.getUTCMonth()+1;
    var firstDow = dow(m), daysIn = new Date(Date.UTC(y, mo, 0)).getUTCDate();
    var cells = WD_SHORT.map(function(w){ return '<span class="wdh">'+w+'</span>'; }).join("");
    for (var i = 1; i < firstDow; i++) cells += '<span class="day"></span>';
    for (var d = 1; d <= daysIn; d++){
      var dt = D(y, mo, d), k = iso(dt), hits = byDay.get(k) || [];
      var isHol = model.hol.set.has(k), isEtag = hits.some(function(h){ return h.r.step.anchor === 0; });
      var cls = "day" + (dow(dt) >= 6 ? " we" : "") + (isHol ? " hol" : "") +
                (hits.length ? " has" : "") + (isEtag ? " etag" : "");
      var title = (isHol ? "Feiertag / frei" : WD_LONG[dow(dt)-1]) + " " + fmt(dt) +
        (hits.length ? "\n" + hits.map(function(h){ return "• " + h.issue.name + ": " + h.r.step.label; }).join("\n") : "");
      var dots = hits.slice(0,4).map(function(h){ return '<i style="--ph:'+phaseOf(h.r.step).css+'"></i>'; }).join("");
      cells += '<span class="'+cls+'" title="'+esc(title)+'">'+d+'<span class="dots">'+dots+'</span></span>';
    }
    return '<div class="month"><h3>'+MONTHS[mo-1]+' <span>'+y+'</span></h3><div class="days">'+cells+'</div></div>';
  }).join("");
  var legend = '<div class="callegend">'+
    PHASES.map(function(p){ return '<span><i style="background:'+p.css+'"></i>'+esc(p.label)+'</span>'; }).join("")+
    '<span><i style="background:var(--milestone)"></i>E-Tag</span>'+
    '<span><i style="background:var(--crit-soft);border:1px solid var(--crit)"></i>Feiertag / frei</span></div>';
  return card("Kalender " + fmt(min) + " – " + fmt(max), '<div class="calgrid">'+grid+'</div>'+legend);
}

/* ---------- Ansicht: Prüfung --------------------------------------------- */
function viewFindings(){
  var f = model.findings;
  if (!f.length) return card("Prüfung", '<div class="empty"><strong>Ohne Befund</strong>Alle Termine liegen auf Arbeitstagen, halten ihre Ziel-Wochentage ein und stehen in gültiger Reihenfolge.</div>');
  var body = '<div class="findings">'+f.map(function(x){
    var label = x.sev === "crit" ? "Fehler" : x.sev === "warn" ? "Prüfen" : "Hinweis";
    return '<div class="finding"><span class="sev '+x.sev+'">'+label+'</span><div>'+
      '<div class="t">'+esc(x.t)+(x.issue ? ' <span class="tag">'+esc(x.issue)+'</span>' : "")+'</div>'+
      '<div class="m">'+x.m+'</div></div></div>';
  }).join("")+'</div>';
  return card("Prüfung · " + f.length + (f.length === 1 ? " Eintrag" : " Einträge"), body);
}

/* ---------- Ansicht: Regelwerk ------------------------------------------- */
function viewRules(){
  var sample = model.issues[Math.min(state.selected, Math.max(0, model.issues.length-1))];
  var opts = function(sel){
    return [[0,"flexibel"],[1,"Montag"],[2,"Dienstag"],[3,"Mittwoch"],[4,"Donnerstag"],[5,"Freitag"]]
      .map(function(o){ return '<option value="'+o[0]+'"'+(sel === o[0] ? " selected" : "")+'>'+o[1]+'</option>'; }).join("");
  };
  var anchors = function(cur, self){
    return '<option value="0"'+(cur === 0 ? " selected" : "")+'>E-Tag (Wurzel)</option>'+
      model.steps.filter(function(s){ return s.nr !== self; }).map(function(s){
        return '<option value="'+s.nr+'"'+(cur === s.nr ? " selected" : "")+'>'+s.nr+" · "+esc(s.label.slice(0,34))+'</option>';
      }).join("");
  };
  var rows = model.steps.map(function(s){
    var r = sample ? sample.byNr.get(s.nr) : null;
    return '<tr data-nr="'+s.nr+'" style="--ph:'+phaseOf(s).css+'">'+
      '<td class="nr">'+s.nr+'</td>'+
      '<td><input type="text" data-r="label" value="'+esc(s.label)+'" aria-label="Bezeichnung Schritt '+s.nr+'"></td>'+
      '<td><select data-r="wd" aria-label="Ziel-Wochentag">'+opts(s.wd)+'</select></td>'+
      '<td><select data-r="anchor" aria-label="Anker">'+anchors(s.anchor, s.nr)+'</select></td>'+
      '<td><input type="number" data-r="offset" value="'+s.offset+'" step="1" aria-label="Versatz in Tagen"'+(s.anchor === 0 ? " disabled" : "")+'></td>'+
      '<td><select data-r="dir" aria-label="Suchrichtung"><option value="-1"'+(s.dir === -1 ? " selected" : "")+'>rückwärts</option>'+
        '<option value="1"'+(s.dir === 1 ? " selected" : "")+'>vorwärts</option></select></td>'+
      '<td><select data-r="phase" aria-label="Phase">'+PHASES.map(function(p){
        return '<option value="'+p.key+'"'+(s.phase === p.key ? " selected" : "")+'>'+esc(p.label)+'</option>'; }).join("")+'</select></td>'+
      '<td class="res">'+(r ? wd(r.date)+" "+fmtShort(r.date) : "–")+'</td>'+
    '</tr>';
  }).join("");
  var head = '<div class="ruleshead">Jeder Schritt rechnet <b>Ankertermin + Versatz</b> und zieht das Ergebnis auf den nächsten '+
    'zulässigen Tag: bei festem Ziel-Wochentag auf diesen Wochentag, sonst auf den nächsten Arbeitstag. '+
    'Die Spalte rechts zeigt das Ergebnis für <b>'+(sample ? esc(sample.name) : "–")+'</b>.</div>';
  var table = '<div class="tablewrap"><table class="rules"><thead><tr>'+
    ["#","Produktionsschritt","Ziel-Wochentag","Anker","Versatz (Tage)","Richtung","Phase","Ergebnis"]
      .map(function(h){ return "<th>"+h+"</th>"; }).join("")+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>';
  return card("Regelwerk · " + model.steps.length + " Schritte", head + table,
    '<button type="button" class="btn sm" data-act="resetRules">Standard wiederherstellen</button>');
}

/* ---------- Ansicht: Pläne ------------------------------------------------ */
function planFortschritt(planId){
  var list = planId === (planMeta && planMeta.id) ? aufgaben : null;
  if (!list) return null;
  var fertig = list.filter(function(t){ return t.erledigt; }).length;
  return {gesamt:list.length, fertig:fertig};
}
function statusChip(pl){
  return pl.status === "fertig"
    ? '<span class="stat fertig">Freigegeben</span>'
    : '<span class="stat entwurf">In Arbeit</span>';
}
function viewPlaene(){
  var sortiert = plaene.slice().sort(function(a,b){
    if ((a.status === "fertig") !== (b.status === "fertig")) return a.status === "fertig" ? -1 : 1;
    return String(b.geaendertAm || "").localeCompare(String(a.geaendertAm || ""));
  });
  var aktuell = sortiert.filter(function(x){ return x.status === "fertig"; })[0];
  var kopf = aktuell
    ? '<div class="aktuell"><div class="lbl">Aktueller Plan</div>'+
      '<div class="ttl">'+esc(aktuell.titel)+'</div>'+
      '<div class="meta">Freigegeben am '+(aktuell.freigegebenAm ? fmt(parseISO(aktuell.freigegebenAm.slice(0,10))) : "–")+
        ' · '+(aktuell.inhalt && aktuell.inhalt.issues ? aktuell.inhalt.issues.length : 0)+' Ausgaben</div>'+
      '<div class="rowbtns"><button type="button" class="btn sm primary" data-act="planOpen" data-v="'+esc(aktuell.id)+'">Öffnen</button></div></div>'
    : '<div class="aktuell leer"><div class="lbl">Noch kein Plan freigegeben</div>'+
      '<div class="meta">Sobald alle Aufgaben eines Plans erledigt sind, wird er freigegeben und erscheint hier.</div></div>';
  var zeilen = sortiert.map(function(pl){
    var offen = planMeta && pl.id === planMeta.id;
    var fs = offen ? planFortschritt(pl.id) : null;
    return '<div class="planrow'+(offen ? " offen" : "")+'">'+
      '<div class="pn"><b>'+esc(pl.titel)+'</b>'+statusChip(pl)+(offen ? '<span class="stat offen">geöffnet</span>' : "")+
        '<span class="sub">'+(pl.inhalt && pl.inhalt.issues ? pl.inhalt.issues.length : 0)+' Ausgaben · zuletzt geändert '+
        (pl.geaendertAm ? fmt(parseISO(pl.geaendertAm.slice(0,10))) : "–")+
        (fs && fs.gesamt ? ' · Aufgaben '+fs.fertig+'/'+fs.gesamt : "")+'</span></div>'+
      '<div class="pj">'+esc(String(pl.jahr || ""))+'</div>'+
      '<div class="pa">'+
        (offen ? '' : '<button type="button" class="btn sm" data-act="planOpen" data-v="'+esc(pl.id)+'">Öffnen</button>')+
        '<button type="button" class="btn sm ghost" data-act="planCopy" data-v="'+esc(pl.id)+'">Duplizieren</button>'+
        '<button type="button" class="btn sm ghost" data-act="planDel" data-v="'+esc(pl.id)+'">Löschen</button>'+
      '</div></div>';
  }).join("");
  var tools = '<button type="button" class="btn sm primary" data-act="planNew">+ Neuer Plan</button>';
  return card("Pläne · " + plaene.length, kopf + '<div class="planlist">'+(zeilen || '<div class="empty">Noch kein Plan gespeichert.</div>')+'</div>', tools) +
    '<section class="card"><header><h2>Ablage</h2></header><div class="body"><div class="ablage">'+
    (Ablage.modus === "geteilt"
      ? '<b>Geteilte Ablage</b> Pläne, Aufgaben und das Team liegen zentral. Alle, die diese Seite öffnen dürfen, sehen denselben Stand; Änderungen erscheinen bei den anderen live.'
      : '<b>Lokale Ablage</b> Diese Fassung speichert im Browser dieses Rechners. Über die veröffentlichte Seite arbeitet das ganze Team auf demselben Stand.')+
    '</div></div></section>';
}

/* ---------- Ansicht: Aufgaben --------------------------------------------- */
function abteilungen(){ return team.filter(function(m){ return m.art === "abteilung"; }); }
function personen(abtId){
  return team.filter(function(m){ return m.art === "person" && (!abtId || m.abteilungId === abtId); });
}
function mitglied(id){ return team.filter(function(m){ return m.id === id; })[0] || null; }
/* Fälligkeit einer Aufgabe: an einen Produktionsschritt gekoppelt oder frei */
function aufgabeFaellig(t){
  if (t.schrittNr && t.ausgabeId){
    var x = model.issues.filter(function(i){ return i.id === t.ausgabeId; })[0];
    var r = x && x.byNr.get(+t.schrittNr);
    if (r) return r.date;
  }
  return t.faellig ? parseISO(t.faellig) : null;
}
function viewAufgaben(){
  if (!planMeta) return card("Aufgaben", '<div class="empty">Kein Plan geöffnet.</div>');
  var fertig = aufgaben.filter(function(t){ return t.erledigt; }).length;
  var quote = aufgaben.length ? Math.round(fertig / aufgaben.length * 100) : 0;

  var abt = abteilungen();
  var gruppen = abt.map(function(a){
    return {a:a, list:aufgaben.filter(function(t){ return t.abteilungId === a.id; })};
  });
  var ohne = aufgaben.filter(function(t){ return !t.abteilungId || !mitglied(t.abteilungId); });
  if (ohne.length) gruppen.push({a:{id:"", name:"Ohne Abteilung"}, list:ohne});

  var listen = gruppen.filter(function(g){ return g.list.length; }).map(function(g){
    var sortiert = g.list.slice().sort(function(x, y){
      if (!!x.erledigt !== !!y.erledigt) return x.erledigt ? 1 : -1;
      var dx = aufgabeFaellig(x), dy = aufgabeFaellig(y);
      if (dx && dy) return dx - dy;
      return dx ? -1 : dy ? 1 : 0;
    });
    var gf = g.list.filter(function(t){ return t.erledigt; }).length;
    return '<div class="taskgroup"><div class="tghead">'+esc(g.a.name)+
      '<span class="tgcount">'+gf+'/'+g.list.length+'</span></div>'+
      sortiert.map(function(t){
        var d = aufgabeFaellig(t);
        var pers = t.personId ? mitglied(t.personId) : null;
        var schritt = t.schrittNr ? model.steps.filter(function(x){ return x.nr === +t.schrittNr; })[0] : null;
        var ausg = t.ausgabeId ? model.issues.filter(function(i){ return i.id === t.ausgabeId; })[0] : null;
        var spaet = d && !t.erledigt && d < heute();
        return '<div class="task'+(t.erledigt ? " done" : "")+'" data-task="'+esc(t.id)+'">'+
          '<input type="checkbox" data-tdone="'+esc(t.id)+'"'+(t.erledigt ? " checked" : "")+
            ' aria-label="Aufgabe erledigt"'+(istGesperrt() ? "" : "")+'>'+
          '<div class="tmain"><span class="tt">'+esc(t.titel)+'</span>'+
            '<span class="tmeta">'+
              (pers ? '<span class="who">'+esc(pers.name)+'</span>' : "")+
              (schritt ? '<span class="lnk">Schritt '+schritt.nr+' · '+esc(schritt.label.slice(0,38))+(ausg ? " · "+esc(ausg.name) : "")+'</span>' : "")+
              (t.notiz ? '<span class="note2">'+esc(t.notiz)+'</span>' : "")+
            '</span></div>'+
          '<span class="tdue'+(spaet ? " late" : "")+'">'+(d ? wd(d)+" "+fmtShort(d) : "–")+'</span>'+
          '<button type="button" class="x" data-tdel="'+esc(t.id)+'" title="Aufgabe löschen" aria-label="Aufgabe löschen">&times;</button>'+
        '</div>';
      }).join("")+'</div>';
  }).join("");

  var stepOpts = '<option value="">kein Bezug</option>' + model.steps.map(function(st){
    return '<option value="'+st.nr+'">'+st.nr+' · '+esc(st.label.slice(0,40))+'</option>';
  }).join("");
  var issueOpts = '<option value="">alle Ausgaben</option>' + model.issues.map(function(x){
    return '<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>';
  }).join("");
  var abtOpts = abt.length
    ? abt.map(function(a){ return '<option value="'+esc(a.id)+'">'+esc(a.name)+'</option>'; }).join("")
    : '<option value="">– erst Abteilung anlegen –</option>';

  var form = '<div class="taskform">'+
    '<input type="text" id="tTitel" placeholder="Was ist zu tun?" aria-label="Aufgabe">'+
    '<select id="tAbt" aria-label="Abteilung">'+abtOpts+'</select>'+
    '<select id="tPers" aria-label="Person"><option value="">Person (optional)</option></select>'+
    '<select id="tSchritt" aria-label="Produktionsschritt">'+stepOpts+'</select>'+
    '<select id="tAusgabe" aria-label="Ausgabe">'+issueOpts+'</select>'+
    '<input type="date" id="tDatum" aria-label="Fällig am">'+
    '<button type="button" class="btn sm primary" id="tAdd">Hinzufügen</button>'+
  '</div>';

  var bar = '<div class="taskbar">'+
    '<div class="prog"><div class="bar"><span style="width:'+quote+'%"></span></div>'+
      '<span class="pt">'+fertig+' von '+aufgaben.length+' erledigt</span></div>'+
    (aufgaben.length && fertig === aufgaben.length && planMeta.status !== "fertig"
      ? '<button type="button" class="btn sm primary" data-act="freigeben">Plan freigeben</button>' : "")+
    (planMeta.status === "fertig"
      ? '<button type="button" class="btn sm" data-act="entsperren">Zur Bearbeitung entsperren</button>' : "")+
  '</div>';

  return card("Aufgaben · " + esc(planMeta.titel), bar + form +
      '<div class="tasklist">'+(listen || '<div class="empty">Noch keine Aufgabe angelegt. Trage oben ein, was für diesen Plan zu erledigen ist – etwa „Themen für die Große Redaktionskonferenz sammeln“ für die Redaktion.</div>')+'</div>') +
    teamCard();
}
function teamCard(){
  var abt = abteilungen();
  var body = abt.length || personen().length
    ? '<div class="teamlist">'+abt.map(function(a){
        return '<div class="teamgroup"><div class="tg"><b>'+esc(a.name)+'</b>'+
          '<button type="button" class="x" data-teamdel="'+esc(a.id)+'" title="Abteilung entfernen" aria-label="Abteilung entfernen">&times;</button></div>'+
          personen(a.id).map(function(pp){
            return '<div class="tp">'+esc(pp.name)+
              '<button type="button" class="x" data-teamdel="'+esc(pp.id)+'" title="Person entfernen" aria-label="Person entfernen">&times;</button></div>';
          }).join("")+
          '<div class="tadd"><input type="text" data-pers-for="'+esc(a.id)+'" placeholder="Person hinzufügen …" aria-label="Person in '+esc(a.name)+'"></div>'+
        '</div>';
      }).join("")+'</div>'
    : '<div class="empty" style="padding:18px 20px">Noch keine Abteilung angelegt.'+
      '<div class="rowbtns" style="justify-content:center"><button type="button" class="btn sm" data-act="teamSeed">Redaktion, Herstellung, Anzeigen, Vertrieb und Druckerei anlegen</button></div></div>';
  return '<section class="card"><header><h2>Abteilungen &amp; Personen</h2>'+
    '<span class="hint">'+abt.length+(abt.length === 1 ? " Abteilung" : " Abteilungen")+' · '+
    personen().length+(personen().length === 1 ? " Person" : " Personen")+'</span></header>'+
    '<div class="body">'+body+
    '<div class="addhol" style="grid-template-columns:1fr auto;margin-top:12px">'+
      '<input type="text" id="abtName" placeholder="Neue Abteilung …" aria-label="Neue Abteilung">'+
      '<button type="button" class="btn sm" id="abtAdd">+ Abteilung</button>'+
    '</div></div></section>';
}
function heute(){
  var n = new Date();
  return D(n.getFullYear(), n.getMonth()+1, n.getDate());
}

/* ---------- Ansicht: Export ---------------------------------------------- */
var EXPORT_FORMATS = [
  {k:"csv-matrix", n:"CSV · Matrix"},
  {k:"csv-liste",  n:"CSV · Terminliste"},
  {k:"ics",        n:"Kalender (.ics)"},
  {k:"json",       n:"Konfiguration (.json)"}
];
var exportFormat = "csv-matrix";
function viewExport(){
  var bar = '<div class="exportbar">'+
    EXPORT_FORMATS.map(function(f){
      return '<button type="button" class="btn sm" data-act="fmt" data-v="'+f.k+'" aria-pressed="'+(exportFormat === f.k)+'">'+f.n+'</button>';
    }).join("")+
    '<span class="spacer"></span>'+
    '<button type="button" class="btn sm" data-act="copy">Kopieren</button>'+
    '<button type="button" class="btn sm primary" data-act="download">Datei sichern</button></div>';
  return card("Export", bar + '<textarea id="exportText" spellcheck="false" aria-label="Exportdaten"></textarea>'+
    '<div class="exphint">CSV mit Semikolon und BOM – öffnet sich in Excel direkt in Spalten. '+
    'Die .ics-Datei legt jeden Termin als ganztägigen Kalendereintrag an. '+
    'In der eingebetteten Ansicht fragt „Datei sichern“ um Bestätigung; Kalenderdateien lassen sich dort nur über „Kopieren“ übernehmen.</div>');
}
function exportPayload(){
  var is = model.issues;
  if (exportFormat === "json") return {name:"produktionsplan-"+state.year+".json", type:"application/json", text:JSON.stringify(state, null, 2)};
  if (exportFormat === "ics"){
    var stamp = new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z", lines = [
      "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//IHK Berlin//Produktionsplan Berliner Wirtschaft//DE","CALSCALE:GREGORIAN"];
    is.forEach(function(x){
      x.rows.forEach(function(r){
        var d1 = iso(r.date).replace(/-/g,""), d2 = iso(addDays(r.date,1)).replace(/-/g,"");
        lines.push("BEGIN:VEVENT",
          "UID:bw-"+state.year+"-"+x.id+"-"+r.step.nr+"@ihk-berlin.de",
          "DTSTAMP:"+stamp, "DTSTART;VALUE=DATE:"+d1, "DTEND;VALUE=DATE:"+d2,
          "SUMMARY:BW "+x.name+": "+r.step.label.replace(/[,;]/g," "),
          "DESCRIPTION:Berliner Wirtschaft "+x.name+" – Schritt "+r.step.nr+" von "+model.steps.length+
            "\\nE-Tag "+fmt(x.etag)+"\\nZiel-Wochentag: "+wdName(r.step.wd)+
            (r.manual ? "\\nManuell gesetzter Sondertermin" : ""),
          "TRANSP:TRANSPARENT","END:VEVENT");
      });
    });
    lines.push("END:VCALENDAR");
    return {name:"produktionsplan-"+state.year+".ics", type:"text/calendar", text:lines.join("\r\n")};
  }
  var rows = [];
  if (exportFormat === "csv-liste"){
    rows.push(["Ausgabe","E-Tag","Schritt-Nr","Produktionsschritt","Datum","Wochentag","KW","Ziel-Wochentag","Verschiebung (Tage)","Herkunft","Automatisch wäre"]);
    is.forEach(function(x){
      x.rows.slice().sort(function(a,b){ return a.date - b.date; }).forEach(function(r){
        var a = x.autoByNr.get(r.step.nr);
        rows.push([x.name, fmt(x.etag), r.step.nr, r.step.label, fmt(r.date), WD_LONG[dow(r.date)-1], isoWeek(r.date),
                   wdName(r.step.wd), r.manual ? 0 : r.shift, r.manual ? "manuell" : "automatisch",
                   r.manual && a ? fmt(a.date) : ""]);
      });
    });
  } else {
    rows.push(["Nr","Produktionsschritt","Ziel-Wochentag"].concat(is.map(function(x){ return x.name; })));
    model.steps.forEach(function(s){
      rows.push([s.nr, s.label, wdName(s.wd)].concat(is.map(function(x){
        var r = x.byNr.get(s.nr); return r ? fmt(r.date) : "";
      })));
    });
  }
  var csv = rows.map(function(r){
    return r.map(function(c){
      c = String(c);
      return /[";\n]/.test(c) ? '"'+c.replace(/"/g,'""')+'"' : c;
    }).join(";");
  }).join("\r\n");
  return {name:"produktionsplan-"+state.year+".csv", type:"text/csv", text:"﻿"+csv};
}
function buildExport(){
  var t = el("exportText");
  if (t) t.value = exportPayload().text;
}

function saveFile(p){
  if (downloadsApi){
    downloadsApi.save({filename:p.name, data:p.text}).then(function(){
      toast(p.name + " gesichert");
    }, function(err){
      var c = err && err.code;
      if (c === "declined") return;
      if (c === "rejected_extension" || c === "extension_not_enabled")
        toast("Dieses Format lässt sich hier nicht sichern – bitte „Kopieren“ verwenden");
      else if (c === "rate_limited") toast("Bitte kurz warten und erneut versuchen");
      else toast("Sichern nicht möglich – bitte „Kopieren“ verwenden");
    });
    return;
  }
  try{
    var blob = new Blob([p.text], {type:p.type + ";charset=utf-8"});
    var url = URL.createObjectURL(blob), link = document.createElement("a");
    link.href = url; link.download = p.name;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    toast(p.name + " gesichert");
  }catch(err){
    toast("Sichern hier nicht erlaubt – bitte „Kopieren“ verwenden");
  }
}

/* ---------- Karten-Hülle -------------------------------------------------- */
function card(title, body, tools){
  return '<section class="card"><header><h2>'+esc(title)+'</h2>'+(tools || "")+'</header>'+body+'</section>';
}
function toast(msg){
  var t = el("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("show"); }, 1900);
}

/* =========================================================================
   Interaktion
   ========================================================================= */
function setYear(y){
  y = Math.max(2000, Math.min(2100, y|0));
  if (y === state.year) return;
  undoSnapshot = {year:state.year, issues:state.issues.map(function(i){ return Object.assign({}, i); }),
                  overrides:Object.assign({}, state.overrides)};
  var names = state.issues.map(function(i){ return i.name; });
  state.overrides = {};
  state.year = y;
  state.issues = suggestIssues(y).map(function(s, i){
    return names[i] ? Object.assign({}, s, {name:names[i]}) : s;
  });
  el("yearInput").value = y;
  render();
}

/* Rail: Jahr */
el("yearInput").addEventListener("change", function(){ setYear(+this.value); });
el("yearMinus").addEventListener("click", function(){ setYear(state.year - 1); });
el("yearPlus").addEventListener("click", function(){ setYear(state.year + 1); });

/* Rail: Ausgaben */
el("issueList").addEventListener("input", function(e){
  var f = e.target.dataset.f, row = e.target.closest(".issue");
  if (!f || !row) return;
  var i = +row.dataset.i;
  if (f === "name") state.issues[i].name = e.target.value;
  if (f === "raw" && e.target.value) state.issues[i].raw = e.target.value;
  render(false);
});
el("issueList").addEventListener("click", function(e){
  if (e.target.dataset.f !== "del") return;
  var i = +e.target.closest(".issue").dataset.i;
  var goneId = state.issues[i].id;
  Object.keys(state.overrides).forEach(function(k){
    if (k.indexOf(goneId + ":") === 0) delete state.overrides[k];
  });
  state.issues.splice(i, 1);
  if (state.selected >= state.issues.length) state.selected = Math.max(0, state.issues.length - 1);
  render();
});
el("addIssue").addEventListener("click", function(){
  var last = state.issues[state.issues.length - 1];
  var next = last ? iso(nthWeekday(parseISO(last.raw).getUTCFullYear() + (parseISO(last.raw).getUTCMonth() === 11 ? 1 : 0),
                     (parseISO(last.raw).getUTCMonth() + 2 > 12 ? 1 : parseISO(last.raw).getUTCMonth() + 2), 3, "first"))
                 : iso(nthWeekday(state.year, 1, 3, "first"));
  state.issues.push({id:"i"+Date.now(), name:"Neue Ausgabe", raw:next});
  render();
});
el("suggestDates").addEventListener("click", function(){
  undoSnapshot = {year:state.year, issues:state.issues.map(function(i){ return Object.assign({}, i); }),
                  overrides:Object.assign({}, state.overrides)};
  state.issues = suggestIssues(state.year);
  state.overrides = {};
  state.selected = 0;
  render();
  toast("Standardraster für " + state.year + " eingesetzt");
});

/* Rail: Feiertage */
el("holidayList").addEventListener("change", function(e){
  var id = e.target.dataset.hol;
  if (!id) return;
  var std = null;
  model.hol.groups.forEach(function(g){ g.items.forEach(function(h){ if (h.id === id) std = h; }); });
  if (!std) return;
  var off = new Set(state.holOff), on = new Set(state.holOn);
  if (std.custom){
    if (!e.target.checked) state.holExtra = state.holExtra.filter(function(x){ return x.id !== id; });
  } else if (std.on){
    e.target.checked ? off.delete(id) : off.add(id);
  } else {
    e.target.checked ? on.add(id) : on.delete(id);
  }
  state.holOff = Array.from(off); state.holOn = Array.from(on);
  render();
});
el("holidayList").addEventListener("click", function(e){
  var id = e.target.dataset.delhol;
  if (!id) return;
  state.holExtra = state.holExtra.filter(function(x){ return x.id !== id; });
  render();
});
el("addHol").addEventListener("click", function(){
  var n = el("holName").value.trim(), d = el("holDate").value;
  if (!d){ toast("Bitte ein Datum wählen"); return; }
  state.holExtra.push({id:"x"+Date.now(), name:n || "Frei", date:d});

    state.holOnlyActive = !state.holOnlyActive;

  render();
  toast(r.length ? "Feiertage für " + r.map(function(x){ return STATES[x]; }).join(" und ")

el("regionBar").addEventListener("change", function(e){

  var r = (state.regions || []).slice();

el("excelMode").addEventListener("click", function(){
  var off = new Set(), on = new Set();
  [state.year-1, state.year, state.year+1].forEach(function(y){
    off.add(y+"-frauentag");                    /* in der Excel-Vorlage nicht enthalten */
    on.add(y+"-reformation");                   /* in der Excel-Vorlage enthalten       */

  state.holOff = Array.from(off); state.holOn = Array.from(on);

});

el("pop").addEventListener("click", function(e){
  var b = e.target.closest("[data-pop]");
  if (!b || !popCtx) return;
  var a = b.dataset.pop, key = popCtx.issue.id + ":" + popCtx.nr;
  if (a === "apply"){
    var v = el("popDate").value;
    if (!v){ toast("Bitte ein Datum wählen"); return; }
    var autoRow = popCtx.issue.autoByNr.get(popCtx.nr);
    if (autoRow && iso(autoRow.date) === v) delete state.overrides[key];
    else state.overrides[key] = v;
    closePop(); render();
    toast("Termin gesetzt – abhängige Schritte neu gerechnet");
  } else if (a === "clear"){
    delete state.overrides[key];
    closePop(); render();
    toast("Wieder automatisch");
  } else {
    closePop();
  }
});

/* Aktionen rund um Pläne, Freigabe und Team */
function planAktion(a, v){
  if (a === "planOpen"){ planOeffnen(v); toast("Plan geöffnet"); }
  else if (a === "planNew"){
    planAnlegen(defaultState(state ? state.year : 2027), "Neuer Plan " + (state ? state.year : 2027), state ? state.year : 2027)
      .then(function(pl){ planOeffnen(pl.id); toast("Neuer Plan angelegt"); });
  }
  else if (a === "planCopy"){
    var q = plaene.filter(function(x){ return x.id === v; })[0];
    if (!q) return;
    var kopieAufgaben = q.id === (planMeta && planMeta.id) ? aufgaben.slice() : [];
    planAnlegen(JSON.parse(JSON.stringify(q.inhalt)), q.titel + " (Kopie)", q.jahr).then(function(pl){
      kopieAufgaben.forEach(function(t){
        var n = Object.assign({}, t, {id:uid("t"), erledigt:false, erledigtAm:""});
        Ablage.aufgabeSichern(pl.id, n);
      });
      planOeffnen(pl.id);
      toast(kopieAufgaben.length ? "Plan mit Aufgaben dupliziert" : "Plan dupliziert");
    });
  }
  else if (a === "planDel"){
    var pd = plaene.filter(function(x){ return x.id === v; })[0];
    if (!pd) return;
    if (!window.confirm("Plan „" + pd.titel + "“ mit allen Aufgaben löschen?")) return;
    plaene = plaene.filter(function(x){ return x.id !== v; });
    Ablage.planLoeschen(v).then(function(){
      if (planMeta && planMeta.id === v){
        planMeta = null; aufgaben = [];
        if (plaene.length) planOeffnen(plaene[0].id);
        else planAnlegen(defaultState(2027), "Produktionsplan 2027", 2027).then(function(pl){ planOeffnen(pl.id); });
      } else render();
    });
    toast("Plan gelöscht");
  }
  else if (a === "freigeben"){
    if (aufgaben.some(function(t){ return !t.erledigt; }) &&
        !window.confirm("Es sind noch Aufgaben offen. Plan trotzdem freigeben?")) return;
    planStatus("fertig");
    toast("Plan freigegeben");
  }
  else if (a === "entsperren"){ planStatus("entwurf"); toast("Plan wieder in Arbeit"); }
  else if (a === "teamSeed"){
    ["Redaktion","Herstellung","Anzeigen","Vertrieb","Druckerei"].forEach(function(n){ teamAnlegen(n, "abteilung"); });
    render();
  }
}

/* Panel: Delegation */
el("panel").addEventListener("click", function(e){
  var pb = e.target.closest("[data-act]");
  if (pb && ["planOpen","planNew","planCopy","planDel","freigeben","entsperren","teamSeed"].indexOf(pb.dataset.act) >= 0){
    planAktion(pb.dataset.act, pb.dataset.v); return;
  }
  if (e.target.id === "tAdd"){ aufgabeAnlegen(); return; }
  if (e.target.id === "abtAdd"){
    var n = el("abtName").value.trim();
    if (!n){ toast("Bitte einen Namen eingeben"); return; }
    teamAnlegen(n, "abteilung"); render();
    return;
  }
  var td = e.target.dataset.tdel;
  if (td && planMeta){
    aufgaben = aufgaben.filter(function(x){ return x.id !== td; });
    Ablage.aufgabeLoeschen(planMeta.id, td);
    renderPanel(); renderPlanCard();
    return;
  }
  var mdel = e.target.dataset.teamdel;
  if (mdel){
    var m = mitglied(mdel);
    if (!m) return;
    if (m.art === "abteilung" && !window.confirm("Abteilung „"+m.name+"“ und ihre Personen entfernen?")) return;
    var weg = [mdel].concat(team.filter(function(x){ return x.abteilungId === mdel; }).map(function(x){ return x.id; }));
    team = team.filter(function(x){ return weg.indexOf(x.id) < 0; });
    weg.forEach(function(idx){ Ablage.teamLoeschen(idx); });
    render();
    return;
  }
  var t = e.target.closest("[data-issue][data-step]");
  if (t && t.dataset.issue){ openPop(t.dataset.issue, +t.dataset.step, t); return; }
  var b = e.target.closest("[data-act]");
  if (!b) return;
  var a = b.dataset.act;
  if (a === "orient"){ state.orientation = b.dataset.v; renderPanel(); save(); }
  else if (a === "fmt"){ exportFormat = b.dataset.v; renderPanel(); }
  else if (a === "resetRules"){
    state.steps = DEFAULT_STEPS.map(function(s){ return Object.assign({}, s); });
    render(); toast("Regelwerk zurückgesetzt");
  }
  else if (a === "copy"){
    var t = el("exportText");
    t.select();
    var done = false;
    try{ done = document.execCommand("copy"); }catch(err){}
    if (!done && navigator.clipboard){ navigator.clipboard.writeText(t.value).then(function(){ toast("In die Zwischenablage kopiert"); }); return; }
    toast(done ? "In die Zwischenablage kopiert" : "Kopieren nicht möglich – Text bitte manuell markieren");
  }
  else if (a === "download") saveFile(exportPayload());
});
el("panel").addEventListener("change", function(e){
  var done = e.target.dataset.tdone;
  if (done && planMeta){
    var t = aufgaben.filter(function(x){ return x.id === done; })[0];
    if (!t) return;
    t.erledigt = e.target.checked;
    t.erledigtAm = e.target.checked ? nowISO() : "";
    Ablage.aufgabeSichern(planMeta.id, t).then(function(){ pruefeFreigabe(); render(false); });
    render(false);
    return;
  }
  if (e.target.id === "tAbt"){ fuellePersonen(); return; }
  if (e.target.id === "tSchritt" || e.target.id === "tAusgabe"){ setzeFaellig(); return; }
  if (e.target.id === "issueSel"){ state.selected = +e.target.value; renderPanel(); save(); return; }
  var f = e.target.dataset.r, tr = e.target.closest("tr[data-nr]");
  if (!f || !tr) return;
  var nr = +tr.dataset.nr, s = state.steps.filter(function(x){ return x.nr === nr; })[0];
  if (!s) return;
  if (f === "label") s.label = e.target.value;
  else if (f === "phase") s.phase = e.target.value;
  else s[f] = +e.target.value;
  render(false);
});
/* Person über die Eingabezeile einer Abteilung anlegen */
el("panel").addEventListener("keydown", function(e){
  if (e.key !== "Enter") return;
  var abt = e.target.dataset.persFor;
  if (abt !== undefined){

/* Personenauswahl an die gewählte Abteilung koppeln */
function fuellePersonen(){
  var sel = el("tPers"), abtSel = el("tAbt");
  if (!sel || !abtSel) return;
  var list = personen(abtSel.value);
  sel.innerHTML = '<option value="">Person (optional)</option>' +
    list.map(function(m){ return '<option value="'+esc(m.id)+'">'+esc(m.name)+'</option>'; }).join("");
}
/* Fälligkeit aus dem gewählten Produktionsschritt übernehmen */
function setzeFaellig(){
  var st = el("tSchritt"), au = el("tAusgabe"), dd = el("tDatum");
  if (!st || !au || !dd) return;
  if (!st.value || !au.value) return;
  var x = model.issues.filter(function(i){ return i.id === au.value; })[0];
  var r = x && x.byNr.get(+st.value);
  if (r) dd.value = iso(r.date);
}

el("panel").addEventListener("input", function(e){
  if (e.target.dataset.r === "label" || e.target.dataset.r === "offset"){
    var tr = e.target.closest("tr[data-nr]"), nr = +tr.dataset.nr;
    var s = state.steps.filter(function(x){ return x.nr === nr; })[0];
    if (!s) return;
    if (e.target.dataset.r === "label") s.label = e.target.value; else s.offset = +e.target.value || 0;
    model = buildModel();
    var res = tr.querySelector(".res");
    var sample = model.issues[Math.min(state.selected, Math.max(0, model.issues.length - 1))];
    var r = sample ? sample.byNr.get(nr) : null;
    if (res) res.textContent = r ? wd(r.date) + " " + fmtShort(r.date) : "–";
    renderMeta(); save();
  }
});

/* =========================================================================
   Pläne, Aufgaben, Team
   ========================================================================= */
function planOeffnen(id){
  var pl = plaene.filter(function(x){ return x.id === id; })[0];
  if (!pl) return;
  planMeta = pl;
  state = normState(pl.inhalt, pl.jahr);
  state.view = state.view || "plan";
  el("yearInput").value = state.year;
  Ablage.aufgabenOeffnen(pl.id);
  try{ localStorage.setItem(LAST_KEY, pl.id); }catch(e){}
  render();
}
function planAnlegen(inhalt, titel, jahr){
  var j = jahr || (state ? state.year : 2027);
  var pl = {id:uid("p"), titel:titel || ("Produktionsplan " + j), jahr:j, status:"entwurf",
            erstelltAm:nowISO(), geaendertAm:nowISO(),
            inhalt: inhalt || defaultState(j)};
  plaene.push(pl);
  return Ablage.planSichern(pl).then(function(){ return pl; });
}
function planStatus(status){
  if (!planMeta) return;
  planMeta.status = status;
  if (status === "fertig") planMeta.freigegebenAm = nowISO();
  else delete planMeta.freigegebenAm;
  Ablage.planSichern(planMeta);
  render();
}
/* Sind alle Aufgaben erledigt, gilt der Plan als freigegeben und liegt im Archiv. */
function pruefeFreigabe(){
  if (!planMeta || planMeta.status === "fertig") return;
  if (!aufgaben.length) return;
  if (aufgaben.some(function(t){ return !t.erledigt; })) return;
  planMeta.status = "fertig";
  planMeta.freigegebenAm = nowISO();
  Ablage.planSichern(planMeta);
  toast("Alle Aufgaben erledigt – Plan freigegeben und abgelegt");
}
function aufgabeAnlegen(){
  if (!planMeta) return;
  var titel = el("tTitel").value.trim();
  if (!titel){ toast("Bitte die Aufgabe benennen"); return; }
  var t = {
    id: uid("t"), titel: titel,
    abteilungId: el("tAbt").value || "",
    personId: el("tPers").value || "",
    schrittNr: el("tSchritt").value ? +el("tSchritt").value : 0,
    ausgabeId: el("tAusgabe").value || "",
    faellig: el("tDatum").value || "",
    erledigt: false, erstelltAm: nowISO()
  };
  aufgaben.push(t);
  Ablage.aufgabeSichern(planMeta.id, t);
  renderPanel(); renderPlanCard();
  var f = el("tTitel"); if (f){ f.value = ""; f.focus(); }
  var dd = el("tDatum"); if (dd) dd.value = "";
}
function teamAnlegen(name, art, abteilungId){
  var m = {id: uid(art === "person" ? "m" : "a"), name: name, art: art,
           abteilungId: abteilungId || "", erstelltAm: nowISO()};
  team.push(m);
  Ablage.teamSichern(m);
  return m;
}

/* Start */
Ablage.beiPlaenen = function(){
  if (planMeta){
    var akt = plaene.filter(function(x){ return x.id === planMeta.id; })[0];
    if (akt && akt !== planMeta){
      planMeta = akt;
      if (!sichernOffen) state = normState(akt.inhalt, akt.jahr);
    }
    if (!akt){ planMeta = null; }
  }
  if (model) render(false);
};
Ablage.beiAufgaben = function(){ if (model){ pruefeFreigabe(); render(false); } };
Ablage.beiTeam    = function(){ if (model) render(false); };

Ablage.start(function(){
  var letzte = null;
  try{ letzte = localStorage.getItem(LAST_KEY); }catch(e){}
  var ziel = plaene.filter(function(x){ return x.id === letzte; })[0];
  if (!ziel){
    var fertige = plaene.filter(function(x){ return x.status === "fertig"; })
      .sort(function(a,b){ return String(b.freigegebenAm||"").localeCompare(String(a.freigegebenAm||"")); });
    ziel = fertige[0] || plaene.slice().sort(function(a,b){
      return String(b.geaendertAm||"").localeCompare(String(a.geaendertAm||"")); })[0];
  }
  if (ziel){ planOeffnen(ziel.id); return; }
  state = defaultState(2027);
  planAnlegen(defaultState(2027), "Produktionsplan 2027", 2027).then(function(pl){ planOeffnen(pl.id); });
});
</script>
